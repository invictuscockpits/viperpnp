<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ViperPNP</title>
    <style>
      :root {
        --bg: #0d1014;
        --text: #e6edf3;
        --muted: #8b97a5;
        --green: #05aa3d;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, Segoe UI, Arial, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .name {
        font-size: 1.4rem;
        letter-spacing: 0.14em;
        font-weight: 600;
      }
      .name span {
        color: var(--green);
      }
      .msg {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .bar {
        width: 220px;
        height: 3px;
        background: #1c232c;
        border-radius: 2px;
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: var(--green);
        border-radius: 2px;
        animation: slide 1.1s ease-in-out infinite alternate;
      }
      @keyframes slide {
        from {
          transform: translateX(-30%);
        }
        to {
          transform: translateX(400%);
        }
      }
      .err {
        display: none;
        max-width: 460px;
        text-align: center;
        color: #f0a8a8;
        font-size: 0.85rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="name">VIPER<span>PNP</span></div>
      <div class="bar" id="bar"></div>
      <div class="msg" id="msg">Starting machine server…</div>
      <div class="err" id="err">
        The machine server did not come up after 90 seconds.<br />
        Check the log at
        <b>%LOCALAPPDATA%\com.invictuscockpits.viperpnp\logs\backend.log</b>
        and restart the app.
      </div>
    </div>
    <script>
      const started = Date.now();
      async function poll() {
        try {
          // no-cors: an opaque response still resolves, which is all the
          // "is it alive yet" check needs.
          await fetch("http://localhost:8077/api/health", {
            mode: "no-cors",
            cache: "no-store",
          });
          location.replace("http://localhost:8077/");
        } catch (e) {
          if (Date.now() - started > 90000) {
            document.getElementById("bar").style.display = "none";
            document.getElementById("msg").style.display = "none";
            document.getElementById("err").style.display = "block";
            return;
          }
          setTimeout(poll, 700);
        }
      }
      poll();
    </script>
  </body>
</html>
